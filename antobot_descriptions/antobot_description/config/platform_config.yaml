## High-level configuration
mileage_path: "/mileage/"

robot_hardware: False   # Set to true if using the robot hardware
robot_platform: "ant"   # For the ant platform, "ant"
robot_version: 4
robot_role: "Assist"

pathFollower: True      # Example for autonmatically launching code of specific module(s)

## Sensor information

lidar:
  c16:    # Front lidar
    px: 0.683
    py: -0.088
    pz: 0.465
    r: 0
    p: 0
    y: 3.14
    mode: "navigation"
    location: "front"

    device_ip: 192.168.1.200 
    msop_port: 2368
    difop_port: 2369

gps:
  urcu:
    px: 0.683
    py: -0.088
    pz: 0.528
    r: 0
    p: 0
    y: 0
    mode: "navigation"

    device_port: "/dev/ttyTHS0"
    rtk_type: "ppp"


imu:
  urcu:
    px: -0.1146
    py: -0.01941
    pz: 0.1832
    r: 0
    p: 0
    y: 0
    mode: "navigation"
    switch: True

