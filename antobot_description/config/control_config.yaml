ant_control_node:
  ros__parameters:
    frequency: 30.0
    max_velocity: [1.3, 1.0] # the first value is for 'lin_vel', the second value is for 'ang_vel'
    min_velocity: [-1.3, -1.0]
    max_accel: [0.25, 1.0]
    max_decel: [-3.0, -3.0]
    velocity_timeout: 0.05


antSafety:
  ros__parameters:
    frequency: 30.0
    uss_front_enable: False # If ure, the safety node activates the USS.
    uss_back_enable: False
    auto_release: False # If ture, the robot will release automaticlly after obstacles are far from robot.