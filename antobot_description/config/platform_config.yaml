## High-level configuration
mileage_path: "/home/danielfreer/Documents/mileage/"
log_path: "/home/danielfreer/Documents/data/antobot_manager_supervisor/logs"

robot_hardware: False
robot_platform: "ant"   # Could be "ant" or "dog"
robot_version: 4
robot_role: "UV"
location: "uk"
pathFollower: True
wallFollower: False
aRCU_enable: False
isolated_cpu: False
lio_enable: False
dualMid360: False

#imu_compensated_frame: False # set this value to False if the imu in URCU is faulty and showing imu drift


## Sensor information

lidar:   # please refer to lidar_config_example.yaml in the same directory for lidar configuration examples.
  1:
    type: mid360
    px: 0.683
    py: 0.0
    pz: 1.1
    r: 0
    p: 0
    y: 2.35
    mode: "navigation"
    location: "front"

    device_ip: 192.168.1.200 
    device_id: 200 

camera:
  zed:
    # need to be updated
    px: 0.683
    py: 0.0
    pz: 1.1
    r: 0
    p: 0
    y: 2.35

    mode: "recording"
    location: "left"

    device_ip: 192.168.1.103

  RP:
    # need to be updated
    px: 0.683
    py: 0.0
    pz: 1.1
    r: 0
    p: 0
    y: 2.35

    mode: "recording"
    location: "left"

    device_ip: 192.168.1.105

gps:
  urcu:  #or f9p_usb or movingbase or urcu
    px: 0.683
    py: 0.0
    pz: 1.41
    r: 0
    p: 0
    y: 0
