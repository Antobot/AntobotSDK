    device_port: "/dev/ttyTHS1"  #or /dev/ttyUSB* for basestation *new for urcu1.5: sudo busybox devmem 0x02430068 w 0x004
    rtk_type: "ntrip"   #ppp or ntrip or ant_mqtt


